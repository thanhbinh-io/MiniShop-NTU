# BUỔI 6 — PHẦN 2
#
# Đây là cấu hình quy trình kiểm thử tự động (pipeline) đầy đủ.
# Quy trình chạy đủ bốn tầng kiểm thử và lưu lại báo cáo.
#
# Lưu ý quan trọng về cú pháp YAML:
#   - thụt lề bằng DẤU CÁCH, không dùng Tab;
#   - mỗi bước bắt đầu bằng "- name:" và thẳng cột với các bước khác;
#   - sai thụt lề thì GitHub bỏ qua cả file và tab Actions không hiện gì.
# Kiểm tra cú pháp tại máy trước khi đẩy lên:
#   node -e "require('fs').readFileSync('.github/workflows/kiem-thu-day-du.yml','utf8')"
#   và dán nội dung vào một trình kiểm tra YAML trực tuyến.

name: Kiểm thử đầy đủ

# Chạy khi đẩy lên bất kỳ nhánh nào, và khi mở pull request vào main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài thư viện
        run: npm ci

      # ESLint đặt continue-on-error vì bài Buổi 1 cố tình để lại cảnh báo.
      # Bước này báo vàng nhưng không chặn các bước sau.
      - name: Phân tích tĩnh bằng ESLint
        run: npm run lint
        continue-on-error: true

      # Bước chạy kiểm thử đơn vị
      - name: Kiểm thử đơn vị
        run: npm test
        if: always()

      # Bước cài trình duyệt cho Playwright — PHẢI nằm TRƯỚC hai bước Playwright.
      # Máy ảo GitHub không có trình duyệt sẵn; thiếu bước này thì
      # hai bước sau thất bại với thông báo "Executable doesn't exist".
      - name: Cài trình duyệt Playwright
        run: npx playwright install --with-deps chromium
        if: always()

      # Bước chạy kiểm thử API
      - name: Kiểm thử API
        run: npx playwright test tests/api
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: bao-cao/api

      # Bước chạy kiểm thử đầu cuối
      - name: Kiểm thử đầu cuối
        run: npx playwright test tests/e2e
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: bao-cao/e2e

      # Bước tải báo cáo lên GitHub
      # if: always() để bước này vẫn chạy dù các bước kiểm thử thất bại,
      # giữ đúng trạng thái thật (job ĐỎ) nhưng vẫn có hiện vật để tra lại.
      - name: Tải báo cáo kiểm thử lên GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bao-cao-kiem-thu
          path: bao-cao/
          retention-days: 7
